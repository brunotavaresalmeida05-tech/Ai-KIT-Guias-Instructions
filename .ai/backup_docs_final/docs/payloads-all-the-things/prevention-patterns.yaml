prevention_patterns:
  - category: "Input Validation"
    description: "Validate all user input - both client and server side"
    patterns:
      - "Use allowlists (not blocklists) for expected input"
      - "Validate type, format, length, range, and structure"
      - "Sanitize input before use in queries, commands, or file paths"
      - "Implement consistent validation across all layers"

  - category: "Output Encoding"
    description: "Encode output based on context"
    patterns:
      - "HTML entity encoding for HTML context"
      - "JavaScript string encoding for JS context"
      - "URL encoding for URL context"
      - "CSS encoding for CSS context"
      - "XML encoding for XML context"

  - category: "Parameterized Queries"
    description: "Prevent SQL injection through parameterization"
    patterns:
      - "Use prepared statements with bound parameters"
      - "Use ORM query builders"
      - "Never concatenate user input into SQL strings"
      - "Apply parameterization even with ORM"

  - category: "Content Security Policy"
    description: "Mitigate XSS through CSP"
    patterns:
      - "Set Content-Security-Policy header"
      - "Use default-src 'self'"
      - "Define script-src, style-src explicitly"
      - "Enable strict-dynamic where possible"
      - "Add report-uri for violation reporting"

  - category: "Path Handling"
    description: "Prevent path traversal attacks"
    patterns:
      - "Use basename() to strip directories"
      - "Canonicalize paths before validation"
      - "Implement allowlist of valid files/dirs"
      - "Use chroot, containers, or jails"
      - "Validate file extensions"

  - category: "Network Controls"
    description: "Prevent SSRF and unauthorized access"
    patterns:
      - "Maintain allowlist of permitted destinations"
      - "Block metadata/metadata service IPs"
      - "Implement egress filtering"
      - "Use separate network for external access"
      - "Validate and parse URLs before fetching"

  - category: "Safe Deserialization"
    description: "Prevent deserialization vulnerabilities"
    patterns:
      - "Use JSON instead of Pickle/Seralize"
      - "Implement class allowlists"
      - "Add integrity checks (HMAC signatures)"
      - "Version serialized data"
      - "Validate schema before deserialization"

  - category: "Principle of Least Privilege"
    description: "Minimize impact of compromises"
    patterns:
      - "Run with minimal privileges"
      - "Use separate users per function"
      - "Implement capability restrictions"
      - "Encrypt sensitive data at rest"
      - "Use short-lived credentials"
      - "Implement proper error handling"

  - category: "Security Headers"
    description: "HTTP security headers"
    patterns:
      - "X-Content-Type-Options: nosniff"
      - "X-Frame-Options: DENY"
      - "Strict-Transport-Security (HSTS)"
      - "X-XSS-Protection (legacy browsers)"
      - "Referrer-Policy"
      - "Permissions-Policy"
