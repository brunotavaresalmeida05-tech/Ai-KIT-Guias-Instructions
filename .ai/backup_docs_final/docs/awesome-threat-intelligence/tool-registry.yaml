categories:
  - name: "Threat Intelligence Platforms"
    tools:
      - name: "MISP"
        description: "Malware Information Sharing Platform"
        url: "https://github.com/MISP/MISP"
        platform: "Linux"
        license: "AGPL-3.0"
        api: "REST API available"
        auth: "API key"
        features: ["event creation", "attribute sharing", "galaxy"]
        
      - name: "IntelMQ"
        description: "Threat intelligence processing ecosystem"
        url: "https://github.com/intelmq/intelmq"
        platform: "Linux"
        license: "GPL-3.0"
        api: "REST API for bot management"
        auth: "API key"
        features: ["mq", "processing", "export"]
        
      - name: "AlienVault OTX"
        description: "Open Threat Exchange"
        url: "https://github.com/alienvault/alienvault-api"
        platform: "Multi-platform API"
        license: "MIT"
        api: "REST API with pulsemapper"
        auth: "API key required"
        features: ["pulses", "indicators", "geolocation"]
        
      - name: "VirusTotal"
        description: "File and URL reputation service"
        url: "https://virustotal.github.io/io-docs/"
        platform: "Web API"
        license: "Freemium (Pro/Public)"
        api: "REST API v3"
        auth: "API key (free tier: 4/min)"
        features: ["vt_intelligence", "behaviour_report", "graph"]
        
      - name: "URLhaus"
        description: "URLhaus - Thebadness.com"
        url: "https://github.com/Neo23x0/urlhaus"
        platform: "Web API"
        license: "CC-BY-4.0"
        api: "REST API"
        auth: "None for lookup, API key for submission"
        features: ["url_lookup", "campaign_search", "tag_search"]
        
      - name: "Abuse.ch"
        description: "Various malware tracking feeds"
        url: "https://github.com/abuse-ch"
        platform: "Web feeds"
        license: "CC-BY-4.0"
        api: "Feed URLs / REST API"
        auth: "None"
        features: ["botnet_c2", "feodo", "ssl_blacklist", "urlhaus"]
        
      - name: "ThreatMiner"
        description: "Threat intelligence minining"
        url: "https://github.com/stamasx/ThreatMiner"
        platform: "Web API"
        license: "MIT"
        api: "REST API"
        auth: "API key"
        features: ["reverse_name", "reverse_ip", "domain_reputation"]
        
      - name: "GREYNOISE"
        description: "Internet background noise intelligence"
        url: "https://github.com/greyzone-collective/greynoise"
        platform: "Web API"
        license: "Commercial with limited free tier"
        api: "REST API v3"
        auth: "API key"
        features: ["ip_reputation", "metadata", "classification"]

  - name: "IOC Feeds"
    tools:
      - name: "Emerging Threats"
        description: "Open source threat feeds"
        url: "https://rules.emergingthreats.net/"
        platform: "SNORT/Suricata rules"
        license: "GPLv2"
      - name: "Pulsedive"
        description: "Threat intelligence feeds"
        url: "https://pulsedive.com/"
        platform: "Web API"
        license: "Freemium"
      - name: "IBM X-Force Exchange"
        description: "Threat intelligence sharing"
        url: "https://xforce.ibmcloud.com/"
        platform: "Web API"
        license: "Freemium"

  - name: "STIX/TAXII"
    tools:
      - name: "Cifram"
        description: "STIX/TAXII server"
        url: "https://cifram.org/"
        platform: "Python"
        license: "MIT"
      - name: "OpenCTI"
        description: "Open Cyber Threat Intelligence"
        url: "https://github.com/OpenCTI-Platform/opencti"
        platform: "Cross-platform"
        license: "Apache-2.0"

  - name: "Regional CERTs"
    tools:
      - name: "CERT-LU"
        description: "Luxembourg CERT feeds"
        url: "https://www.cert.lu/"
        platform: "Various formats"
        license: "Public"
      - name: "CERT-Bund"
        description: "German CERT"
        url: "https://www.bsi.bund.de/DE/Service/Internetreports/ThreatIntelligence/threat-intelligence_node.html"
        platform: "STIX, CSV"
        license: "Public"
      - name: "JPCERT"
        description: "Japan Computer Emergency Response Team"
        url: "https://www.jpcert.or.jp/"
        platform: "Various"
        license: "Public"
      - name: "MALWARE-INFO"
        description: "Malaysia CERT malware reports"
        url: "https://github.com/malware-info/feeds"
        platform: "JSON, CSV"
        license: "MIT"
