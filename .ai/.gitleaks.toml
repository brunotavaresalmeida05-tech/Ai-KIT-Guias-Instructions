[allowlist]
description = "Global allowlist"
paths = [
  '''test.*\.ts''',
  '''spec.*\.ts''',
  '''__mocks__.*''',
  '''\.example''',
  '''\.md''',
  '''node_modules''',
  '''dist''',
  '''coverage'''
]
regexes = [
  '''(?i)example''',
  '''(?i)test[_-]?key''',
  '''(?i)mock''',
  '''(?i)placeholder''',
  '''(?i)changeme''',
  '''(?i)your[-_]?key[-_]?here''',
  '''(?i)not[-_]?real''',
  '''dummy[-_]?secret'''
]

[[rules]]
id = 'generic-api-key'
description = 'Generic API Key'
regex = '''(?i)(api[_-]?key|apikey)['"]?\s*[:=]\s*['"][a-zA-Z0-9_\-]{24,}['"]'''
tags = ['key', 'api']

[[rules]]
id = 'jwt-secret'
description = 'JWT Secret'
regex = '''(?i)(jwt[_-]?secret|JWT_SECRET)['"]?\s*[:=]\s*['"][^'"]{16,}['"]'''
tags = ['secret', 'jwt']

[[rules]]
id = 'github-token'
description = 'GitHub Token'
regex = '''(?i)gh[po]_[a-zA-Z0-9]{20,}'''
tags = ['github', 'token']
