apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-kit-postgres
  namespace: ai-kit
  labels:
    app.kubernetes.io/name: ai-kit
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgres
spec:
  serviceName: ai-kit-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-kit
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-kit
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "ai_kit_dev"
        - name: POSTGRES_USER
          value: "ai_kit_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-kit-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pg_isready -h localhost -p 5432"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pg_isready -h localhost -p 5432"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: postgres-config
        configMap:
          name: ai-kit-postgres-init
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi