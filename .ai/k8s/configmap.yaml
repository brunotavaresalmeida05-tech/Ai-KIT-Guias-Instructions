apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-kit-config
  namespace: ai-kit
  labels:
    app.kubernetes.io/name: ai-kit
    app.kubernetes.io/component: config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
  OTEL_ENABLED: "false"
  API_HOST: "0.0.0.0"
  MEMORY_BACKEND: "postgres"
  EMBEDDING_PROVIDER: "hash"
  LLM_PROVIDER: "none"
  MAX_CONCURRENT_TASKS: "5"