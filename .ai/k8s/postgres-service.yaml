apiVersion: v1
kind: Service
metadata:
  name: ai-kit-postgres
  namespace: ai-kit
  labels:
    app.kubernetes.io/name: ai-kit
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app.kubernetes.io/name: ai-kit
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: postgres