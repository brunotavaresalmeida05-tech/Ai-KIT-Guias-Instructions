apiVersion: v1
kind: Service
metadata:
  name: ai-kit-redis
  namespace: ai-kit
  labels:
    app.kubernetes.io/name: ai-kit
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: redis
    protocol: TCP
    name: redis
  selector:
    app.kubernetes.io/name: ai-kit
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: redis